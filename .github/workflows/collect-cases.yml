name: Collect AI and tech cases

on:
  schedule:
    # Monday 00:00 UTC is 08:00 in Asia/Kuala_Lumpur.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect-cases
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public Cisco feeds into inbox drafts
        run: python3 collector/collect.py --cases data/cases --inbox data/inbox --sources collector/sources.json

      - name: Open a pull request when new drafts exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data/inbox)" ]; then
            echo "No new inbox drafts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bot/case-inbox-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add data/inbox
          git commit -m "collect: draft newly observed AI and tech solution items"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "수집: 새 AI·보안 솔루션 사례 초안" --body "$(cat <<'EOF'
          ## 요약
          주간 수집 봇이 공개 Cisco 피드에서 케이스 뱅크에 없는 항목을 찾아 `data/inbox` 초안으로 올렸습니다.

          ## PM 검토
          - 초안은 `status: inbox`이며 검색 인덱스에 들어가지 않습니다.
          - 제품, 산업, RACI, WBS, 리스크를 채우고 계획 밴드와 공개 수치를 구분한 뒤 `status`를 `reviewed`로 바꿉니다.
          - 피드에 없는 고객 실적, 금액, 기간은 비워 둡니다.

          EOF
          )"
