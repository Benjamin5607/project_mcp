name: One-pager specialist

on:
  workflow_dispatch:
    inputs:
      pain:
        description: 고객 페인포인트
        required: true
        default: AI가 데이터베이스에서 정보를 찾아오는데 너무 느림
      requirements:
        description: 특별 요구사항
        required: true
        default: 클라우드와 연결되지 않은 인트라넷에서만 작동 요망 그리고 그래픽카드 최소화
      customer:
        description: 고객 표시 이름
        required: false
        default: 내부 지식검색
      use_nvidia:
        description: NVIDIA_API_KEY로 클라우드 모델을 호출합니다. 폐쇄망 요구가 있으면 코드가 호출을 막습니다.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select a model and draft a one-pager
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ONEPAGER_ALLOW_NVIDIA: ${{ inputs.use_nvidia && 'true' || 'false' }}
          ONEPAGER_DIR: ${{ github.workspace }}/artifacts/onepager-data
          ONEPAGER_PAIN: ${{ inputs.pain }}
          ONEPAGER_REQUIREMENTS: ${{ inputs.requirements }}
          ONEPAGER_CUSTOMER: ${{ inputs.customer }}
        run: node scripts/onepager.mjs --out artifacts/onepager

      - uses: actions/upload-artifact@v4
        with:
          name: onepager-draft
          path: artifacts/onepager
